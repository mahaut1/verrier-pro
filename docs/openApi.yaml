openapi: 3.0.3
info:
  title: VerrierPro API
  version: 1.0.0
  description: |
    API de gestion d'un atelier de verrier artisanal :
    - Authentification par session (cookie)
    - Gestion des galeries
    - Gestion des pièces, types et sous-types
    - Gestion de stock
    - Commandes et items de commande
    - Événements et pièces exposées
    - Dashboard et seuils de stock
    - Proxy sécurisé vers stockage R2 pour les images

servers:
  - url: https://verrier-pro-production.up.railway.app

tags:
  - name: Auth
  - name: Galleries
  - name: PieceTypes
  - name: PieceSubtypes
  - name: Pieces
  - name: Stock
  - name: Orders
  - name: OrderItems
  - name: Events
  - name: EventPieces
  - name: Dashboard
  - name: R2
  - name: Health

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: connect.sid

  schemas:

    Error:
      type: object
      properties:
        message:
          type: string
          example: "Données invalides"
        errors:
          type: array
          nullable: true
          items:
            type: object

    Role:
      type: string
      enum: [admin, artisan, client]
      example: artisan

    User:
      type: object
      properties:
        id:
          type: integer
          example: 1
        username:
          type: string
          example: "mwglass"
        email:
          type: string
          example: "contact@mwglass.fr"
        firstName:
          type: string
          example: "Mahaut"
        lastName:
          type: string
          example: "Windal"
        role:
          $ref: "#/components/schemas/Role"
        createdAt:
          type: string
          format: date-time

    RegisterUserRequest:
      type: object
      required: [username, password, email, firstName, lastName]
      properties:
        username:
          type: string
          example: "mwglass"
        password:
          type: string
          example: "Verre2025!"
        email:
          type: string
          example: "contact@mwglass.fr"
        firstName:
          type: string
          example: "Mahaut"
        lastName:
          type: string
          example: "Windal"
        role:
          $ref: "#/components/schemas/Role"

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          description: username ou email
          example: "mwglass"
        password:
          type: string
          example: "Verre2025!"

    ForgotPasswordRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          example: "contact@mwglass.fr"

    ResetPasswordRequest:
      type: object
      required: [token, newPassword]
      properties:
        token:
          type: string
          example: "a8c91fd3d4j1b8c91fj91b2"
        newPassword:
          type: string
          example: "NouveauMdp!2025"

    Gallery:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: integer
        name:
          type: string
          example: "Galerie Lumière"
        contactPerson:
          type: string
          nullable: true
          example: "Élise Dupont"
        email:
          type: string
          nullable: true
          example: "elise.dupont@galerie-lumiere.fr"
        phone:
          type: string
          nullable: true
          example: "+33 6 22 54 18 90"
        address:
          type: string
          nullable: true
          example: "12 Rue des Arts"
        city:
          type: string
          nullable: true
          example: "Paris"
        country:
          type: string
          nullable: true
          example: "France"
        commissionRate:
          type: string
          nullable: true
          example: "40.00"
        notes:
          type: string
          nullable: true
        isActive:
          type: boolean
          example: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    GalleryCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
        contactPerson:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        address:
          type: string
          nullable: true
        city:
          type: string
          nullable: true
        country:
          type: string
          nullable: true
        commissionRate:
          type: string
          nullable: true
          example: "40.00"
        notes:
          type: string
          nullable: true
        isActive:
          type: boolean
          nullable: true

    GalleryUpdate:
      type: object
      properties:
        name:
          type: string
        contactPerson:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        address:
          type: string
          nullable: true
        city:
          type: string
          nullable: true
        country:
          type: string
          nullable: true
        commissionRate:
          type: string
          nullable: true
        notes:
          type: string
          nullable: true
        isActive:
          type: boolean
          nullable: true

    PieceType:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: integer
        name:
          type: string
          example: "Vase"
        description:
          type: string
          nullable: true
          example: "Pièces creuses pour fleurs."
        isActive:
          type: boolean
          example: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    PieceTypeCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
        description:
          type: string
          nullable: true
        isActive:
          type: boolean
          nullable: true

    PieceTypeUpdate:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
          nullable: true
        isActive:
          type: boolean
          nullable: true

    PieceSubtype:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: integer
        pieceTypeId:
          type: integer
        name:
          type: string
          example: "Vase opalin"
        description:
          type: string
          nullable: true
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    PieceSubtypeCreate:
      type: object
      required: [pieceTypeId, name]
      properties:
        pieceTypeId:
          type: integer
        name:
          type: string
        description:
          type: string
          nullable: true

    PieceSubtypeUpdate:
      type: object
      properties:
        pieceTypeId:
          type: integer
        name:
          type: string
        description:
          type: string
          nullable: true
        isActive:
          type: boolean
          nullable: true

    PieceStatus:
      type: string
      enum: [workshop, gallery, sold]
      example: "workshop"

    Piece:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: integer
        name:
          type: string
          example: "Vase opalin bleu"
        uniqueId:
          type: string
          example: "V-2025-OPALIN-001"
        pieceTypeId:
          type: integer
          nullable: true
        pieceSubtypeId:
          type: integer
          nullable: true
        dimensions:
          type: string
          nullable: true
          example: "H28 x L12 cm"
        dominantColor:
          type: string
          nullable: true
          example: "Bleu"
        description:
          type: string
          nullable: true
        status:
          $ref: "#/components/schemas/PieceStatus"
        currentLocation:
          type: string
          example: "atelier"
        galleryId:
          type: integer
          nullable: true
        price:
          type: string
          example: "180.00"
        imageUrl:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    PieceCreate:
      type: object
      required: [name, uniqueId, price]
      properties:
        name:
          type: string
        uniqueId:
          type: string
        pieceTypeId:
          type: integer
          nullable: true
        pieceSubtypeId:
          type: integer
          nullable: true
        dimensions:
          type: string
          nullable: true
        dominantColor:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        status:
          $ref: "#/components/schemas/PieceStatus"
        currentLocation:
          type: string
        galleryId:
          type: integer
          nullable: true
        price:
          type: string
        imageUrl:
          type: string
          nullable: true

    PieceUpdate:
      type: object
      properties:
        name:
          type: string
        uniqueId:
          type: string
        pieceTypeId:
          type: integer
          nullable: true
        pieceSubtypeId:
          type: integer
          nullable: true
        dimensions:
          type: string
          nullable: true
        dominantColor:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        status:
          $ref: "#/components/schemas/PieceStatus"
        currentLocation:
          type: string
        galleryId:
          type: integer
          nullable: true
        price:
          type: string
        imageUrl:
          type: string
          nullable: true

    PieceListPaginated:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Piece"
        pagination:
          type: object
          properties:
            page:
              type: integer
              example: 1
            pageSize:
              type: integer
              example: 12
            total:
              type: integer
              example: 40
            totalPages:
              type: integer
              example: 4

    StockItem:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: integer
        name:
          type: string
          example: "Barre de verre borosilicate"
        type:
          type: string
          example: "verre"
        category:
          type: string
          example: "Matière première"
        currentQuantity:
          type: string
          example: "42.00"
        unit:
          type: string
          example: "kg"
        minimumThreshold:
          type: string
          example: "10.00"
        supplier:
          type: string
          nullable: true
          example: "Verre & Co"
        notes:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    StockItemCreate:
      type: object
      required: [name, type, category, currentQuantity, unit, minimumThreshold]
      properties:
        name:
          type: string
        type:
          type: string
        category:
          type: string
        currentQuantity:
          type: string
        unit:
          type: string
        minimumThreshold:
          type: string
        supplier:
          type: string
          nullable: true
        notes:
          type: string
          nullable: true

    StockItemUpdate:
      type: object
      properties:
        name:
          type: string
        type:
          type: string
        category:
          type: string
        currentQuantity:
          type: string
        unit:
          type: string
        minimumThreshold:
          type: string
        supplier:
          type: string
          nullable: true
        notes:
          type: string
          nullable: true

    StockMovementType:
      type: string
      enum: [in, out]
      example: "out"

    StockMovement:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: integer
        stockItemId:
          type: integer
          nullable: true
        type:
          $ref: "#/components/schemas/StockMovementType"
        quantity:
          type: string
          example: "5.00"
        reason:
          type: string
          example: "Utilisé pour 3 vases opalins"
        notes:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time

    StockMovementCreate:
      type: object
      required: [type, quantity, reason]
      properties:
        stockItemId:
          type: integer
          nullable: true
        type:
          $ref: "#/components/schemas/StockMovementType"
        quantity:
          type: string
        reason:
          type: string
        notes:
          type: string
          nullable: true

    StockMovementUpdate:
      type: object
      properties:
        stockItemId:
          type: integer
          nullable: true
        type:
          $ref: "#/components/schemas/StockMovementType"
        quantity:
          type: string
        reason:
          type: string
        notes:
          type: string
          nullable: true

    OrderStatus:
      type: string
      enum: [pending, processing, shipped, delivered, cancelled]
      example: "pending"

    Order:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: integer
        orderNumber:
          type: string
          example: "CMD-2025-001"
        galleryId:
          type: integer
          nullable: true
        status:
          $ref: "#/components/schemas/OrderStatus"
        totalAmount:
          type: string
          nullable: true
          example: "420.00"
        shippingAddress:
          type: string
          nullable: true
        notes:
          type: string
          nullable: true
        shippedAt:
          type: string
          format: date-time
          nullable: true
        deliveredAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    OrderCreate:
      type: object
      required: [orderNumber]
      properties:
        orderNumber:
          type: string
        status:
          $ref: "#/components/schemas/OrderStatus"
        galleryId:
          type: integer
          nullable: true
        shippingAddress:
          type: string
          nullable: true
        notes:
          type: string
          nullable: true
        shippedAt:
          type: string
          format: date-time
          nullable: true
        deliveredAt:
          type: string
          format: date-time
          nullable: true

    OrderUpdate:
      type: object
      properties:
        orderNumber:
          type: string
        status:
          $ref: "#/components/schemas/OrderStatus"
        galleryId:
          type: integer
          nullable: true
        shippingAddress:
          type: string
          nullable: true
        notes:
          type: string
          nullable: true
        shippedAt:
          type: string
          format: date-time
          nullable: true
        deliveredAt:
          type: string
          format: date-time
          nullable: true

    OrderItem:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: integer
        orderId:
          type: integer
        pieceId:
          type: integer
          nullable: true
        price:
          type: string
          example: "180.00"
        createdAt:
          type: string
          format: date-time

    OrderItemCreate:
      type: object
      required: [orderId, pieceId]
      properties:
        orderId:
          type: integer
        pieceId:
          type: integer
        price:
          type: string
          nullable: true

    OrderItemUpdate:
      type: object
      properties:
        orderId:
          type: integer
        pieceId:
          type: integer
          nullable: true
        price:
          type: string
          nullable: true

    EventType:
      type: string
      enum: [exhibition, fair, workshop, sale]
      example: "exhibition"

    EventStatus:
      type: string
      enum: [planned, confirmed, completed, cancelled]
      example: "planned"

    Event:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: integer
        name:
          type: string
          example: "Exposition Printemps Lumineux"
        type:
          $ref: "#/components/schemas/EventType"
        venue:
          type: string
          nullable: true
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time
          nullable: true
        description:
          type: string
          nullable: true
        website:
          type: string
          nullable: true
        participationFee:
          type: string
          nullable: true
        status:
          $ref: "#/components/schemas/EventStatus"
        notes:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    EventCreate:
      type: object
      required: [name, type, startDate]
      properties:
        name:
          type: string
        type:
          $ref: "#/components/schemas/EventType"
        venue:
          type: string
          nullable: true
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time
          nullable: true
        description:
          type: string
          nullable: true
        website:
          type: string
          nullable: true
        participationFee:
          type: string
          nullable: true
        status:
          $ref: "#/components/schemas/EventStatus"
        notes:
          type: string
          nullable: true

    EventUpdate:
      type: object
      properties:
        name:
          type: string
        type:
          $ref: "#/components/schemas/EventType"
        venue:
          type: string
          nullable: true
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time
          nullable: true
        description:
          type: string
          nullable: true
        website:
          type: string
          nullable: true
        participationFee:
          type: string
          nullable: true
        status:
          $ref: "#/components/schemas/EventStatus"
        notes:
          type: string
          nullable: true

    EventPiece:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: integer
        eventId:
          type: integer
        pieceId:
          type: integer
        displayPrice:
          type: string
          nullable: true
        sold:
          type: boolean
        createdAt:
          type: string
          format: date-time

    EventPieceCreate:
      type: object
      required: [pieceId]
      properties:
        pieceId:
          type: integer
        displayPrice:
          type: string
          nullable: true
        sold:
          type: boolean
          nullable: true

    EventPieceUpdate:
      type: object
      properties:
        pieceId:
          type: integer
        displayPrice:
          type: string
          nullable: true
        sold:
          type: boolean
          nullable: true

    DashboardStats:
      type: object
      example:
        piecesCount: 120
        galleriesCount: 4
        ordersCount: 36
        eventsCount: 5

    LowStockItem:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        currentQuantity:
          type: string
        minimumThreshold:
          type: string
        unit:
          type: string

security:
  - cookieAuth: []

paths:

  /api/register:
    post:
      tags: [Auth]
      summary: Inscription d’un utilisateur
      security: []  # public
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterUserRequest"
      responses:
        '200':
          description: Utilisateur créé
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        '400':
          description: Données invalides ou username déjà pris
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/login:
    post:
      tags: [Auth]
      summary: Connexion utilisateur (username ou email)
      security: []  # public
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        '200':
          description: Connexion réussie
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        '400':
          description: Paramètres manquants
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        '401':
          description: Identifiants invalides
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/auth/user:
    get:
      tags: [Auth]
      summary: Récupérer l’utilisateur connecté
      responses:
        '200':
          description: Utilisateur courant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        '401':
          description: Non authentifié
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        '404':
          description: Utilisateur introuvable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/logout:
    post:
      tags: [Auth]
      summary: Déconnexion
      responses:
        '200':
          description: Déconnexion OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Déconnexion réussie"

  /api/password/forgot:
    post:
      tags: [Auth]
      summary: Demande de reset mot de passe
      security: []  # public
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordRequest"
      responses:
        '200':
          description: Toujours 200 (ne révèle pas si l’email existe)
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Si un compte existe, un lien a été envoyé."

  /api/password/reset:
    post:
      tags: [Auth]
      summary: Réinitialiser le mot de passe
      security: []  # public
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        '200':
          description: Mot de passe mis à jour
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Mot de passe mis à jour."
        '400':
          description: Token invalide/expiré ou mot de passe trop court
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/galleries:
    get:
      tags: [Galleries]
      summary: Lister les galeries
      parameters:
        - in: query
          name: isActive
          schema:
            type: boolean
        - in: query
          name: q
          schema:
            type: string
      responses:
        '200':
          description: Liste des galeries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Gallery"
    post:
      tags: [Galleries]
      summary: Créer une galerie
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GalleryCreate"
      responses:
        '201':
          description: Galerie créée
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Gallery"
        '400':
          description: Données invalides
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/galleries/{id}:
    get:
      tags: [Galleries]
      summary: Obtenir une galerie
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Galerie
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Gallery"
        '400':
          description: Paramètres invalides
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        '404':
          description: Galerie introuvable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      tags: [Galleries]
      summary: Mettre à jour une galerie
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GalleryUpdate"
      responses:
        '200':
          description: Galerie mise à jour
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Gallery"
        '400':
          description: Données invalides
